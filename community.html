
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#c0392b;--red-bright:#e74c3c;--red-dim:rgba(192,57,43,0.18);
  --black:#0a0a0a;--surface:#111;--surface2:#181818;--wire:#242424;
  --text:#e8e0d8;--text-muted:#5a5050;
  --mono:'IBM Plex Mono',monospace;--display:'Bebas Neue',sans-serif;
}
body{background:var(--black);color:var(--text);font-family:var(--mono);}

.section{
  background:var(--black);
  padding:72px 0 80px;
  border-top:1px solid var(--wire);
  overflow:hidden;
  position:relative;
}

.section::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 39px,var(--wire) 39px,var(--wire) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,var(--wire) 39px,var(--wire) 40px);
  opacity:.35;
}

.inner{max-width:900px;margin:0 auto;padding:0 32px;position:relative;}

.section-label{
  font-size:10px;letter-spacing:.35em;color:var(--red);text-transform:uppercase;
  margin-bottom:10px;
}
.section-title{
  font-family:var(--display);font-size:clamp(36px,6vw,60px);
  letter-spacing:.06em;line-height:1;color:var(--text);margin-bottom:8px;
}
.section-sub{
  font-size:11px;letter-spacing:.15em;color:var(--text-muted);
  text-transform:uppercase;margin-bottom:52px;
  max-width:520px;line-height:1.8;
}
.section-sub em{color:var(--red);font-style:normal;}

.count-row{
  display:flex;align-items:baseline;gap:10px;margin-bottom:32px;
}
.count-num{
  font-family:var(--display);font-size:42px;letter-spacing:.06em;color:var(--red);
}
.count-label{
  font-size:10px;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase;
}

.mosaic{
  position:relative;
  min-height:340px;
  border:1px solid var(--wire);
  background:#0d0d0d;
  overflow:hidden;
}

.mosaic-inner{
  display:flex;flex-wrap:wrap;align-content:flex-start;
  gap:0;padding:16px;
  min-height:340px;
}

.tile{
  position:relative;
  flex-shrink:0;
  border:1px solid var(--wire);
  overflow:hidden;
  transition:transform .2s,border-color .2s,z-index 0s;
  cursor:pointer;
}
.tile:hover{
  border-color:var(--red);
  transform:scale(1.06) translateY(-2px);
  z-index:10;
}
.tile canvas,.tile img{
  display:block;width:100%;height:100%;object-fit:cover;
}

.tile.new-arrival{
  animation:arrive .55s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes arrive{
  from{opacity:0;transform:scale(.6) translateY(24px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}

.mosaic-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:260px;gap:12px;
}
.mosaic-empty-icon{
  font-size:32px;color:var(--wire);
}
.mosaic-empty-text{
  font-size:10px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;
}

.your-badge{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(192,57,43,0.85);
  font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;text-align:center;padding:3px 0;
  pointer-events:none;
}

.mosaic-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 8px;
  border-top:1px solid var(--wire);
  background:#0d0d0d;
}
.mosaic-footer-note{
  font-size:9px;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase;
}
.mosaic-footer-live{
  display:flex;align-items:center;gap:6px;
  font-size:9px;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--red);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.demo-controls{
  margin-top:24px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.demo-btn{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-muted);background:transparent;
  border:1px solid var(--wire);padding:8px 18px;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.demo-btn:hover{border-color:var(--red);color:var(--red);}
.demo-note{
  font-size:9px;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;
}
</style>

<div class="section">
  <div class="inner">
    <div class="section-label">Community</div>
    <div class="section-title">YOU WERE HERE</div>
    <div class="section-sub">
      Engineers build for people. Every visitor leaves a mark —
      <em>your drawing lives in this wall.</em>
      A small reminder that behind every system, there are hands.
    </div>

    <div class="count-row">
      <div class="count-num" id="count-display">—</div>
      <div class="count-label">marks left so far</div>
    </div>

    <div class="mosaic" id="mosaic">
      <div class="mosaic-inner" id="mosaic-inner"></div>
      <div class="mosaic-footer">
        <div class="mosaic-footer-note">hover to inspect · newest at end</div>
        <div class="mosaic-footer-live"><div class="live-dot"></div>live</div>
      </div>
    </div>

    <div class="demo-controls">
      <button class="demo-btn" id="btn-add">+ simulate new visitor</button>
      <button class="demo-btn" id="btn-load-mine">inject my drawing</button>
      <span class="demo-note">in production: drawings load from Firestore in real time</span>
    </div>
  </div>
</div>

<script>
const inner = document.getElementById('mosaic-inner');
const countEl = document.getElementById('count-display');
let count = 0;

const TILE_SIZES = [
  {w:90,h:70},{w:80,h:80},{w:100,h:65},{w:75,h:85},{w:110,h:70},{w:85,h:90}
];

const SEED_DRAWINGS = [
  {strokes:[{c:'#e74c3c',pts:[[10,20],[30,40],[50,20],[70,45],[90,25]]},{c:'#e8e0d8',pts:[[20,50],[40,60],[60,55],[80,65]]}]},
  {strokes:[{c:'#e8e0d8',pts:[[15,35],[35,20],[55,35],[75,20],[95,35]]},{c:'#e74c3c',pts:[[20,55],[60,55]]}]},
  {strokes:[{c:'#f39c12',pts:[[50,15],[80,55],[20,55],[50,15]]},{c:'#e74c3c',pts:[[50,35],[50,65]]}]},
  {strokes:[{c:'#e8e0d8',pts:[[20,20],[80,20],[80,65],[20,65],[20,20]]},{c:'#e74c3c',pts:[[35,42],[65,42]]}]},
  {strokes:[{c:'#e74c3c',pts:[[50,15],[65,40],[95,40],[70,58],[80,85],[50,68],[20,85],[30,58],[5,40],[35,40],[50,15]]}]},
  {strokes:[{c:'#888070',pts:[[15,65],[35,25],[55,65]]},{c:'#e8e0d8',pts:[[35,25],[75,25],[75,65],[15,65]]}]},
  {strokes:[{c:'#e74c3c',pts:[[50,20],[50,75]]},{c:'#e74c3c',pts:[[20,47],[80,47]]},{c:'#888070',pts:[[28,28],[72,66]]},{c:'#888070',pts:[[72,28],[28,66]]}]},
  {strokes:[{c:'#e8e0d8',pts:[[50,18],[58,38],[80,38],[62,52],[70,72],[50,58],[30,72],[38,52],[20,38],[42,38],[50,18]]}]},
  {strokes:[{c:'#e74c3c',pts:[[20,50],[32,30],[44,50],[56,30],[68,50],[80,30]]}]},
  {strokes:[{c:'#f39c12',pts:[[50,18],...Array.from({length:16},(_,i)=>[50+32*Math.cos(i*Math.PI*2/16),18+32*Math.sin(i*Math.PI*2/16)])]},{c:'#e74c3c',pts:[[50,26],...Array.from({length:16},(_,i)=>[50+18*Math.cos(i*Math.PI*2/16),26+18*Math.sin(i*Math.PI*2/16)])]}]},
  {strokes:[{c:'#e8e0d8',pts:[[15,65],[50,20],[85,65]]},{c:'#e74c3c',pts:[[30,65],[50,30],[70,65]]}]},
  {strokes:[{c:'#888070',pts:[[20,30],[80,30]]},{c:'#888070',pts:[[20,50],[80,50]]},{c:'#888070',pts:[[20,70],[80,70]]},{c:'#e74c3c',pts:[[40,20],[40,80]]},{c:'#e74c3c',pts:[[60,20],[60,80]]}]},
];

function makeCanvas(drawing, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0,0,w,h);
  const scaleX = w/100, scaleY = h/80;
  drawing.strokes.forEach(s => {
    ctx.beginPath();
    ctx.strokeStyle = s.c;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    s.pts.forEach((p,i) => {
      const x = p[0]*scaleX, y = p[1]*scaleY;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
  return c;
}

function addTile(canvasEl, isYours=false, animate=false) {
  const sz = TILE_SIZES[count % TILE_SIZES.length];
  const tile = document.createElement('div');
  tile.className = 'tile' + (animate ? ' new-arrival' : '');
  tile.style.width = sz.w + 'px';
  tile.style.height = sz.h + 'px';
  tile.appendChild(canvasEl);
  if (isYours) {
    const badge = document.createElement('div');
    badge.className = 'your-badge';
    badge.textContent = 'you';
    tile.appendChild(badge);
  }
  inner.appendChild(tile);
  count++;
  countEl.textContent = count;
  if (animate) {
    setTimeout(() => tile.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}

function makeSyntheticCanvas(drawing) {
  const sz = TILE_SIZES[count % TILE_SIZES.length];
  return makeCanvas(drawing, sz.w, sz.h);
}

function seedMosaic() {
  SEED_DRAWINGS.forEach(d => {
    const sz = TILE_SIZES[count % TILE_SIZES.length];
    const c = makeCanvas(d, sz.w, sz.h);
    addTile(c, false, false);
  });
}

function randomStrokeDrawing() {
  const colors = ['#e74c3c','#e8e0d8','#888070','#f39c12'];
  const strokes = [];
  const n = 2 + Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const pts = [];
    let x = 10 + Math.random()*80, y = 10 + Math.random()*70;
    for(let j=0;j<6+Math.floor(Math.random()*8);j++){
      pts.push([Math.max(5,Math.min(95,x)),Math.max(5,Math.min(75,y))]);
      x += (Math.random()-.5)*30;
      y += (Math.random()-.5)*25;
    }
    strokes.push({c:colors[Math.floor(Math.random()*colors.length)],pts});
  }
  return {strokes};
}

document.getElementById('btn-add').addEventListener('click',()=>{
  const d = randomStrokeDrawing();
  const sz = TILE_SIZES[count % TILE_SIZES.length];
  const c = makeCanvas(d, sz.w, sz.h);
  addTile(c, false, true);
});

document.getElementById('btn-load-mine').addEventListener('click',()=>{
  const data = localStorage.getItem('visitor_drawing');
  if (!data) {
    const d = randomStrokeDrawing();
    const sz = TILE_SIZES[count % TILE_SIZES.length];
    const c = makeCanvas(d, sz.w, sz.h);
    addTile(c, true, true);
    return;
  }
  const img = new Image();
  img.onload = () => {
    const sz = TILE_SIZES[count % TILE_SIZES.length];
    const cv = document.createElement('canvas');
    cv.width = sz.w; cv.height = sz.h;
    cv.getContext('2d').drawImage(img,0,0,sz.w,sz.h);
    addTile(cv, true, true);
  };
  img.src = data;
});

seedMosaic();
</script>
