
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Instrument+Serif:ital@0;1&display=swap');

  .port-wrap { font-family: 'DM Mono', monospace; background: #0e0e0e; min-height: 600px; display: flex; flex-direction: column; align-items: center; padding: 2rem 1.5rem 3rem; box-sizing: border-box; width: 100%; }
  .port-header { text-align: center; margin-bottom: 2rem; }
  .port-title { font-family: 'Instrument Serif', serif; font-size: 28px; font-style: italic; color: #f0ece3; letter-spacing: -0.5px; margin: 0 0 6px; }
  .port-sub { font-size: 11px; color: #666; letter-spacing: 0.12em; text-transform: uppercase; margin: 0; }
  .canvas-container { position: relative; border: 1px solid #2a2a2a; background: #faf8f3; }
  #drawCanvas { display: block; cursor: crosshair; touch-action: none; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-top: 12px; width: 560px; flex-wrap: wrap; }
  .color-row { display: flex; gap: 6px; align-items: center; }
  .color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s, transform 0.1s; }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #f0ece3; }
  .tool-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 5px 10px; cursor: pointer; transition: all 0.15s; }
  .tool-btn:hover { background: #252525; color: #f0ece3; border-color: #444; }
  .tool-btn.active { background: #f0ece3; color: #0e0e0e; border-color: #f0ece3; }
  .size-row { display: flex; gap: 6px; align-items: center; }
  .size-dot { border-radius: 50%; background: #888; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .size-dot:hover { background: #f0ece3; transform: scale(1.2); }
  .size-dot.active { background: #f0ece3; }
  .spacer { flex: 1; }
  .submit-row { display: flex; gap: 8px; margin-top: 12px; width: 560px; justify-content: space-between; align-items: center; }
  .name-input { background: #1a1a1a; border: 1px solid #2a2a2a; color: #f0ece3; font-family: 'DM Mono', monospace; font-size: 11px; padding: 7px 12px; outline: none; flex: 1; letter-spacing: 0.06em; }
  .name-input::placeholder { color: #444; }
  .name-input:focus { border-color: #555; }
  .btn-submit { background: #f0ece3; color: #0e0e0e; border: none; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 18px; cursor: pointer; transition: opacity 0.15s; }
  .btn-submit:hover { opacity: 0.85; }
  .btn-clear { background: transparent; border: 1px solid #2a2a2a; color: #555; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 14px; cursor: pointer; transition: all 0.15s; }
  .btn-clear:hover { border-color: #555; color: #888; }
  .divider { width: 560px; height: 1px; background: #1e1e1e; margin: 2.5rem 0 2rem; }
  .wall-header { width: 560px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2rem; }
  .wall-title { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: #f0ece3; }
  .wall-count { font-size: 10px; color: #444; letter-spacing: 0.1em; }
  .drawing-wall { width: 560px; display: flex; flex-wrap: wrap; gap: 10px; min-height: 80px; }
  .drawing-tile { position: relative; background: #faf8f3; border: 1px solid #1e1e1e; overflow: hidden; flex-shrink: 0; transition: transform 0.15s; }
  .drawing-tile:hover { transform: scale(1.04); z-index: 2; }
  .drawing-tile canvas { display: block; }
  .tile-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(14,14,14,0.75); color: #888; font-size: 9px; text-align: center; padding: 3px 4px; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-enter { display: block; margin: 2.5rem auto 0; background: transparent; border: 1px solid #333; color: #555; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 32px; cursor: pointer; transition: all 0.2s; }
  .btn-enter:hover { border-color: #f0ece3; color: #f0ece3; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #f0ece3; color: #0e0e0e; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; padding: 8px 18px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }
</style>

<div class="port-wrap">
  <div class="port-header">
    <p class="port-sub">before you enter</p>
    <h1 class="port-title">Leave something behind</h1>
    <p class="port-sub">a symbol, a shape, anything that's yours</p>
  </div>

  <div class="canvas-container">
    <canvas id="drawCanvas" width="560" height="280"></canvas>
  </div>

  <div class="toolbar">
    <div class="color-row" id="colorRow">
      <div class="color-swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></div>
      <div class="color-swatch" data-color="#c0392b" style="background:#c0392b"></div>
      <div class="color-swatch" data-color="#2471a3" style="background:#2471a3"></div>
      <div class="color-swatch" data-color="#1e8449" style="background:#1e8449"></div>
      <div class="color-swatch" data-color="#d4a017" style="background:#d4a017"></div>
      <div class="color-swatch" data-color="#8e44ad" style="background:#8e44ad"></div>
      <div class="color-swatch" data-color="#e67e22" style="background:#e67e22"></div>
    </div>
    <div class="spacer"></div>
    <div class="size-row" id="sizeRow">
      <div class="size-dot active" data-size="2" style="width:8px;height:8px"></div>
      <div class="size-dot" data-size="5" style="width:12px;height:12px"></div>
      <div class="size-dot" data-size="10" style="width:18px;height:18px"></div>
    </div>
    <button class="tool-btn active" id="btnBrush">brush</button>
    <button class="tool-btn" id="btnEraser">eraser</button>
    <button class="tool-btn" id="btnUndo">undo</button>
  </div>

  <div class="submit-row">
    <input class="name-input" id="nameInput" type="text" placeholder="your name or initials (optional)" maxlength="24" />
    <button class="btn-clear" id="btnClear">clear</button>
    <button class="btn-submit" id="btnSubmit">add to wall →</button>
  </div>

  <div class="divider"></div>

  <div class="wall-header">
    <span class="wall-title">Everyone who visited</span>
    <span class="wall-count" id="wallCount">0 drawings</span>
  </div>
  <div class="drawing-wall" id="drawingWall"></div>

  <button class="btn-enter" id="btnEnter">enter portfolio →</button>
</div>
<div class="toast" id="toast">drawing added to the wall</div>

<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#faf8f3';
ctx.fillRect(0,0,560,280);

let painting = false;
let tool = 'brush';
let color = '#1a1a1a';
let size = 2;
let history = [];
let lastX = 0, lastY = 0;

function saveState() {
  history.push(canvas.toDataURL());
  if (history.length > 30) history.shift();
}
saveState();

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  if (e.touches) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('mousedown', e => { painting = true; const p = getPos(e); lastX = p.x; lastY = p.y; saveState(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); painting = true; const p = getPos(e); lastX = p.x; lastY = p.y; saveState(); }, {passive:false});

function draw(e) {
  if (!painting) return;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.strokeStyle = tool === 'eraser' ? '#faf8f3' : color;
  ctx.lineWidth = tool === 'eraser' ? size * 4 : size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  lastX = p.x; lastY = p.y;
}

canvas.addEventListener('mousemove', draw);
canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e); }, {passive:false});
canvas.addEventListener('mouseup', () => painting = false);
canvas.addEventListener('mouseleave', () => painting = false);
canvas.addEventListener('touchend', () => painting = false);

document.querySelectorAll('.color-swatch').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    color = s.dataset.color;
    tool = 'brush';
    document.getElementById('btnBrush').classList.add('active');
    document.getElementById('btnEraser').classList.remove('active');
  });
});

document.querySelectorAll('.size-dot').forEach(d => {
  d.addEventListener('click', () => {
    document.querySelectorAll('.size-dot').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
    size = parseInt(d.dataset.size);
  });
});

document.getElementById('btnBrush').addEventListener('click', () => {
  tool = 'brush';
  document.getElementById('btnBrush').classList.add('active');
  document.getElementById('btnEraser').classList.remove('active');
});

document.getElementById('btnEraser').addEventListener('click', () => {
  tool = 'eraser';
  document.getElementById('btnEraser').classList.add('active');
  document.getElementById('btnBrush').classList.remove('active');
});

document.getElementById('btnUndo').addEventListener('click', () => {
  if (history.length > 1) {
    history.pop();
    const img = new Image();
    img.src = history[history.length - 1];
    img.onload = () => ctx.drawImage(img, 0, 0);
  }
});

document.getElementById('btnClear').addEventListener('click', () => {
  saveState();
  ctx.fillStyle = '#faf8f3';
  ctx.fillRect(0, 0, 560, 280);
});

const wall = document.getElementById('drawingWall');
const wallCount = document.getElementById('wallCount');
let drawings = JSON.parse(localStorage.getItem('portfolio_drawings') || '[]');

function renderWall() {
  wall.innerHTML = '';
  drawings.forEach(d => addTile(d.data, d.name));
  wallCount.textContent = drawings.length + ' drawing' + (drawings.length !== 1 ? 's' : '');
}

function addTile(dataUrl, name) {
  const tile = document.createElement('div');
  tile.className = 'drawing-tile';
  tile.style.width = '80px';
  tile.style.height = '60px';
  const tc = document.createElement('canvas');
  tc.width = 80; tc.height = 60;
  const tctx = tc.getContext('2d');
  const img = new Image();
  img.onload = () => {
    tctx.drawImage(img, 0, 0, 80, 60);
  };
  img.src = dataUrl;
  tile.appendChild(tc);
  if (name) {
    const label = document.createElement('div');
    label.className = 'tile-name';
    label.textContent = name;
    tile.appendChild(label);
  }
  wall.appendChild(tile);
}

renderWall();

document.getElementById('btnSubmit').addEventListener('click', () => {
  const dataUrl = canvas.toDataURL('image/png');
  const name = document.getElementById('nameInput').value.trim();
  const entry = { data: dataUrl, name: name || '', ts: Date.now() };
  drawings.push(entry);
  if (drawings.length > 200) drawings = drawings.slice(-200);
  localStorage.setItem('portfolio_drawings', JSON.stringify(drawings));
  addTile(entry.data, entry.name);
  wallCount.textContent = drawings.length + ' drawing' + (drawings.length !== 1 ? 's' : '');
  ctx.fillStyle = '#faf8f3';
  ctx.fillRect(0, 0, 560, 280);
  history = [];
  saveState();
  document.getElementById('nameInput').value = '';
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
  document.getElementById('drawingWall').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

document.getElementById('btnEnter').addEventListener('click', () => {
  alert('→ This would navigate to portfolio.html in your live site.');
});
</script>
